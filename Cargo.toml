[package]
name = "bittopos-core"
version = "0.1.0"
edition = "2021"
description = "Núcleo inicial de Bittopos: recursos identificados y persistidos en TOML"
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
uuid = { version = "1", features = ["v7", "serde"] }
tempfile = "3"

[dev-dependencies]
tempfile = "3"
